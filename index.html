<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- App Update Tag: SlateBattle-v2.0-SingleScreenSlate -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Battle - Le duel de mots</title>
    <!-- PeerJS pour la connexion en ligne -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #090d16;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            padding: 5px;
        }

        /* Conteneur principal simulant la structure de l'ardoise en plein écran mobile */
        .slate-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 880px;
            background-image: linear-gradient(rgba(10, 15, 25, 0.75), rgba(10, 15, 25, 0.85)), url('ardoise.jpg');
            background-size: cover;
            background-position: center;
            border: 5px solid #5c3a21;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0,0,0,0.6);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* En-tête : Titre, Score et Pièces */
        .slate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 17, 32, 0.85);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        h1 {
            font-size: 1.2rem;
            color: #38bdf8;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        .coins-display {
            background: rgba(250, 204, 21, 0.2);
            color: #facc15;
            border: 1px solid rgba(250, 204, 21, 0.5);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Tableau noir central (Zone d'affichage du mot ou des options) */
        .slate-board-center {
            background: rgba(15, 23, 42, 0.75);
            border: 2px dashed rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            margin: 8px 0;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        #themeDisplay {
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }
        #wordDisplay {
            font-size: 1.5rem;
            letter-spacing: 5px;
            margin: 6px 0;
            color: #facc15;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 15px rgba(250, 204, 21, 0.5);
        }
        #timerDisplay {
            font-size: 0.8rem;
            color: #f87171;
            font-weight: 700;
            background: rgba(15, 23, 42, 0.9);
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        /* Panneau de contrôle vertical unifié (Menu + Commandes) */
        .control-panel {
            background: rgba(11, 17, 32, 0.9);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #334155;
            background: #0b1120;
            color: white;
            font-size: 0.9rem;
            text-align: center;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .btn {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            padding: 11px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s ease;
            box-shadow: 0 3px 10px rgba(2, 132, 199, 0.4);
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            border: 1px solid #475569;
        }
        .btn-whatsapp {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 3px 10px rgba(34, 197, 94, 0.4);
        }
        .btn-quit {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            font-size: 0.75rem;
            padding: 5px 8px;
            width: auto;
            display: inline-block;
        }
        .btn-bonus {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            color: #090d16;
            font-weight: bold;
            font-size: 0.75rem;
            padding: 5px 8px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        /* Pavé de lettres virtuel */
        .virtual-keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 4px;
        }
        .key-btn {
            background: rgba(51, 65, 85, 0.95);
            color: white;
            border: none;
            padding: 10px 0;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .key-btn:active:not(:disabled) {
            transform: scale(0.9);
        }
        .key-btn:disabled {
            background: rgba(30, 41, 59, 0.5);
            color: #64748b;
            cursor: not-allowed;
        }

        .taunts-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-top: 4px;
        }
        .taunt-btn {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 4px 6px;
            font-size: 0.65rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .taunt-btn:active {
            transform: scale(0.95);
        }

        .room-box {
            background: #0b1120;
            padding: 10px;
            border-radius: 8px;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.9rem;
            margin: 6px 0;
            border: 1px solid #334155;
            word-break: break-all;
        }
        .status-badge {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f59e0b;
            margin-right: 5px;
        }
        .status-badge.connected {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
        .hidden { display: none !important; }
        #chatLog {
            font-size: 0.7rem;
            color: #38bdf8;
            height: 14px;
            font-style: italic;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>

    <div class="slate-container" id="mainContainer">
        <!-- EN-TÊTE FIXE SUR L'ARDOISE -->
        <div class="slate-header">
            <h1>Slate Battle ✏️</h1>
            <div class="coins-display">🪙 <span id="playerCoins">75</span></div>
        </div>

        <!-- ZONE CENTRALE (Tableau noir) -->
        <div class="slate-board-center" id="boardCenter">
            <!-- VUE MENU PRINCIPAL -->
            <div id="menuContent" style="width: 100%;">
                <p style="color: #94a3b8; font-size: 0.8rem; margin-bottom: 8px;">Le duel de mots en ligne</p>
                <div style="font-size: 2rem; margin: 10px 0;">🏫 ⚔️ 📝</div>
                <p style="color: #cbd5e1; font-size: 0.75rem; font-style: italic;">Prépare ta craie et affronte tes amis !</p>
            </div>

            <!-- VUE HÔTE (En Ligne) -->
            <div id="hostContent" class="hidden" style="width: 100%;">
                <div style="font-size: 0.85rem; color: #94a3b8;">Partage ce code à ton ami :</div>
                <div class="room-box" id="myPeerId">Génération...</div>
                <div style="font-size: 0.8rem; color: #f59e0b;"><span class="status-badge" id="hostStatusBadge"></span><span id="hostStatusText">En attente...</span></div>
            </div>

            <!-- VUE REJOINDRE -->
            <div id="joinContent" class="hidden" style="width: 100%;">
                <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px;">Entre le code de ton ami :</div>
                <input type="text" id="joinCodeInput" placeholder="Code salon...">
                <button class="btn" id="connectBtn" style="margin-top: 8px;">Se connecter</button>
            </div>

            <!-- VUE JEU EN COURS -->
            <div id="gameContent" class="hidden" style="width: 100%;">
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 4px;">
                    <span id="timerDisplay">⏳ 60s</span>
                    <button class="btn btn-quit" onclick="quitGame()">🚪 Quitter</button>
                </div>
                <div id="themeDisplay">Thème : Chargement...</div>
                <div id="wordDisplay">_ _ _ _ _</div>
                <div id="chatLog"></div>
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 4px;">
                    <div id="errorsDisplay" style="color: #cbd5e1; font-size: 0.75rem;">Erreurs : 0 / 6</div>
                    <button class="btn-bonus" onclick="buyHint()">💡 Indice (-20 🪙)</button>
                </div>
            </div>
        </div>

        <!-- PANNEAU DE CONTRÔLE / BOUTONS (Vertical pour une main) -->
        <div class="control-panel" id="controlPanel">
            <!-- Contrôles du Menu -->
            <div id="menuActions" style="display: flex; flex-direction: column; gap: 6px;">
                <input type="text" id="playerNameInput" placeholder="Ton pseudo (ex: Dédé)..." maxlength="12">
                <button class="btn" id="localBtn">🎮 Jouer en solo</button>
                <div style="display: flex; gap: 6px;">
                    <button class="btn btn-secondary" id="hostBtn" style="flex: 1;">🌐 Créer</button>
                    <button class="btn btn-secondary" id="joinBtn" style="flex: 1;">🔑 Rejoindre</button>
                </div>
                <a href="https://wa.me/?text=Viens%20on%20joue%20à%20Slate%20Battle%20sur%20https://dd-dev-88.github.io/slate-battle/" target="_blank" class="btn btn-whatsapp">💬 Inviter sur WhatsApp</a>
            </div>

            <!-- Contrôles de l'écran Hôte -->
            <div id="hostActions" class="hidden">
                <button class="btn btn-whatsapp" id="shareCodeWhatsApp">💬 Partager sur WhatsApp</button>
                <button class="btn btn-secondary" id="backFromHost" style="margin-top: 6px;">Retour</button>
            </div>

            <!-- Contrôles de l'écran Rejoindre -->
            <div id="joinActions" class="hidden">
                <button class="btn btn-secondary" id="backFromJoin">Retour au menu</button>
            </div>

            <!-- Clavier virtuel (Actif uniquement pendant le jeu) -->
            <div id="gameActions" class="hidden">
                <div class="virtual-keyboard" id="virtualKeyboard"></div>
                <div class="taunts-container">
                    <button class="taunt-btn" onclick="sendTaunt('🐢 Plus vite !')">🐢 Plus vite</button>
                    <button class="taunt-btn" onclick="sendTaunt('😎 Facile !')">😎 Facile</button>
                    <button class="taunt-btn" onclick="sendTaunt('😱 Raté !')">😱 Raté</button>
                    <button class="taunt-btn" onclick="sendTaunt('🔥 Je chauffe !')">🔥 Je chauffe</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now);
                osc.frequency.setValueAtTime(880, now + 0.08);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.setValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                osc.frequency.setValueAtTime(1046.50, now + 0.3);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(200, now + 0.2);
                osc.frequency.setValueAtTime(120, now + 0.4);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            }
        }

        // Éléments UI
        const menuContent = document.getElementById('menuContent');
        const hostContent = document.getElementById('hostContent');
        const joinContent = document.getElementById('joinContent');
        const gameContent = document.getElementById('gameContent');

        const menuActions = document.getElementById('menuActions');
        const hostActions = document.getElementById('hostActions');
        const joinActions = document.getElementById('joinActions');
        const gameActions = document.getElementById('gameActions');
        const mainContainer = document.getElementById('mainContainer');

        const localBtn = document.getElementById('localBtn');
        const hostBtn = document.getElementById('hostBtn');
        const joinBtn = document.getElementById('joinBtn');
        const connectBtn = document.getElementById('connectBtn');
        const backFromHost = document.getElementById('backFromHost');
        const backFromJoin = document.getElementById('backFromJoin');
        const shareCodeWhatsApp = document.getElementById('shareCodeWhatsApp');

        const myPeerIdEl = document.getElementById('myPeerId');
        const joinCodeInput = document.getElementById('joinCodeInput');
        const playerNameInput = document.getElementById('playerNameInput');
        const wordDisplay = document.getElementById('wordDisplay');
        const themeDisplay = document.getElementById('themeDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const errorsDisplay = document.getElementById('errorsDisplay');
        const chatLog = document.getElementById('chatLog');
        const virtualKeyboard = document.getElementById('virtualKeyboard');
        const playerCoinsEl = document.getElementById('playerCoins');
        const hostStatusBadge = document.getElementById('hostStatusBadge');
        const hostStatusText = document.getElementById('hostStatusText');

        const wordBank = [
            { word: "JAVASCRIPT", theme: "Technologie & Web" },
            { word: "PROGRAMME", theme: "Technologie & Web" },
            { word: "ORDINATEUR", theme: "Technologie & Web" },
            { word: "CLAVIER", theme: "Technologie & Web" },
            { word: "INTERNET", theme: "Technologie & Web" },
            { word: "MAISON", theme: "Vie quotidienne" },
            { word: "LUMIERE", theme: "Vie quotidienne" },
            { word: "COULEUR", theme: "Vie quotidienne" },
            { word: "OCEAN", theme: "Nature & Environnement" },
            { word: "MONTAGNE", theme: "Nature & Environnement" },
            { word: "SOLEIL", theme: "Nature & Environnement" },
            { word: "VICTOIRE", theme: "Action & Compétition" },
            { word: "CHAMPION", theme: "Action & Compétition" },
            { word: "AVENTURE", theme: "Action & Compétition" }
        ];

        let currentItem = { word: "JAVASCRIPT", theme: "Technologie & Web" };
        let guessedLetters = [];
        let errors = 0;
        let maxErrors = 6;
        let timeLeft = 60;
        let timer;
        let playerName = "Moi";
        let playerCoins = 75;
        let peer = null;
        let conn = null;
        let generatedRoomId = "";

        function showScreen(screen) {
            menuContent.classList.add('hidden');
            hostContent.classList.add('hidden');
            joinContent.classList.add('hidden');
            gameContent.classList.add('hidden');

            menuActions.classList.add('hidden');
            hostActions.classList.add('hidden');
            joinActions.classList.add('hidden');
            gameActions.classList.add('hidden');

            if (screen === 'menu') {
                menuContent.classList.remove('hidden');
                menuActions.classList.remove('hidden');
            } else if (screen === 'host') {
                hostContent.classList.remove('hidden');
                hostActions.classList.remove('hidden');
            } else if (screen === 'join') {
                joinContent.classList.remove('hidden');
                joinActions.classList.remove('hidden');
            } else if (screen === 'game') {
                gameContent.classList.remove('hidden');
                gameActions.classList.remove('hidden');
            }
        }

        function updateCoins(amount) {
            playerCoins += amount;
            playerCoinsEl.innerText = playerCoins;
        }

        function buyHint() {
            if (playerCoins < 20) {
                alert("Pas assez de pièces !");
                return;
            }
            updateCoins(-20);
            const unrevealed = currentItem.word.split('').filter(l => !guessedLetters.includes(l));
            if (unrevealed.length > 0) {
                const randomLetter = unrevealed[Math.floor(Math.random() * unrevealed.length)];
                handleGuess(randomLetter);
            }
        }

        function buildKeyboard() {
            virtualKeyboard.innerHTML = '';
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let letter of alphabet) {
                const btn = document.createElement('button');
                btn.classList.add('key-btn');
                btn.innerText = letter;
                btn.id = `key-${letter}`;
                btn.addEventListener('click', () => handleGuess(letter));
                virtualKeyboard.appendChild(btn);
            }
        }

        function updateDisplay() {
            let displayed = currentItem.word.split('').map(letter => guessedLetters.includes(letter) ? letter : '_').join(' ');
            wordDisplay.innerText = displayed;
            themeDisplay.innerText = `Thème : ${currentItem.theme}`;
            errorsDisplay.innerText = `Erreurs : ${errors} / ${maxErrors}`;

            if (!displayed.includes('_')) {
                clearInterval(timer);
                playSound('win');
                updateCoins(25);
                alert("Bravo ! Tu as trouvé le mot ! (+25 🪙)");
                nextRound();
            }
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 60;
            timerDisplay.innerText = `⏳ ${timeLeft}s`;
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `⏳ ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    playSound('lose');
                    alert("Temps écoulé !");
                    nextRound();
                }
            }, 1000);
        }

        function triggerShake() {
            mainContainer.classList.add('shake');
            setTimeout(() => { mainContainer.classList.remove('shake'); }, 400);
        }

        function quitGame() {
            if (confirm("Quitter la partie ?")) {
                clearInterval(timer);
                if (peer) peer.destroy();
                showScreen('menu');
            }
        }

        function nextRound() {
            errors = 0;
            guessedLetters = [];
            currentItem = wordBank[Math.floor(Math.random() * wordBank.length)];
            buildKeyboard();
            startTimer();
            updateDisplay();
        }

        function startGame() {
            const enteredName = playerNameInput.value.trim();
            if (enteredName) { playerName = enteredName; }
            showScreen('game');
            currentItem = wordBank[Math.floor(Math.random() * wordBank.length)];
            buildKeyboard();
            startTimer();
            updateDisplay();
        }

        localBtn.addEventListener('click', startGame);

        hostBtn.addEventListener('click', () => {
            const enteredName = playerNameInput.value.trim();
            if (enteredName) { playerName = enteredName; }
            showScreen('host');
            hostStatusBadge.classList.remove('connected');
            hostStatusText.innerText = "En attente...";
            myPeerIdEl.innerText = "Génération...";

            if (peer) peer.destroy();
            peer = new Peer();
            peer.on('open', (id) => {
                generatedRoomId = id;
                myPeerIdEl.innerText = id;
            });
            peer.on('connection', (c) => {
                conn = c;
                hostStatusBadge.classList.add('connected');
                hostStatusText.innerText = "Connecté ! Lancement...";
                setTimeout(startGame, 1000);
            });
        });

        shareCodeWhatsApp.addEventListener('click', () => {
            if (!generatedRoomId) return;
            const msg = encodeURIComponent(`Viens m'affronter sur Slate Battle ! Code : ${generatedRoomId} - https://dd-dev-88.github.io/slate-battle/`);
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        });

        joinBtn.addEventListener('click', () => {
            const enteredName = playerNameInput.value.trim();
            if (enteredName) { playerName = enteredName; }
            showScreen('join');
        });

        connectBtn.addEventListener('click', () => {
            const code = joinCodeInput.value.trim();
            if (!code) { alert("Entre un code !"); return; }
            if (peer) peer.destroy();
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(code);
                startGame();
            });
        });

        backFromHost.addEventListener('click', () => { showScreen('menu'); if (peer) peer.destroy(); });
        backFromJoin.addEventListener('click', () => { showScreen('menu'); if (peer) peer.destroy(); });

        window.sendTaunt = function(message) {
            chatLog.innerText = `💬 ${playerName} : "${message}"`;
            setTimeout(() => { chatLog.innerText = ""; }, 3000);
            if (conn && conn.open) {
                conn.send({ type: 'TAUNT', sender: playerName, message: message });
            }
        };

        function handleGuess(letter) {
            if (guessedLetters.includes(letter)) return;
            guessedLetters.push(letter);
            const keyBtn = document.getElementById(`key-${letter}`);
            if (keyBtn) keyBtn.disabled = true;

            if (currentItem.word.includes(letter)) {
                playSound('correct');
            } else {
                errors++;
                playSound('wrong');
                triggerShake();
                if (errors >= maxErrors) {
                    clearInterval(timer);
                    playSound('lose');
                    alert(`Perdu ! Le mot était : ${currentItem.word}`);
                    nextRound();
                    return;
                }
            }
            updateDisplay();
        }
    </script>
</body>
</html>
