<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- App Update Tag: SlateBattle-v2.1-ArcadeMenu -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Battle - Le duel de mots</title>
    <!-- PeerJS pour la connexion en ligne -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #090d16;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Conteneur principal simulant la borne / l'écran mobile */
        .arcade-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 880px;
            background-image: linear-gradient(rgba(10, 15, 25, 0.7), rgba(10, 15, 25, 0.85)), url('ardoise.jpg');
            background-size: cover;
            background-position: center;
            border: 6px solid #5c3a21;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* En-tête : Titre et Pièces */
        .arcade-header {
            text-align: center;
            background: rgba(11, 17, 32, 0.85);
            padding: 12px;
            border-radius: 14px;
            border: 2px solid #854d0e;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 1.8rem;
            color: #facc15;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #000, 0 0 15px rgba(250, 204, 21, 0.5);
        }
        .coins-display {
            color: #facc15;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 4px;
        }

        /* Centre de l'écran : Menu vertical ou Tableau de jeu */
        .arcade-screen-center {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Boutons principaux style "Panneaux de bois" (comme ton image) */
        .wood-menu-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            max-width: 320px;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #854d0e;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            font-size: 1rem;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #facc15;
        }

        .btn-wood {
            width: 100%;
            max-width: 320px;
            background: linear-gradient(135deg, #b45309 0%, #78350f 100%);
            color: #fef3c7;
            border: 3px solid #f59e0b;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.2);
            transition: transform 0.1s ease, filter 0.1s ease;
            text-align: center;
            text-decoration: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .btn-wood:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }
        .btn-green {
            background: linear-gradient(135deg, #15803d 0%, #166534 100%);
            border-color: #4ade80;
            color: #dcfce7;
        }

        /* Barre d'icônes du bas (style ton image) */
        .arcade-footer-icons {
            display: flex;
            justify-content: space-around;
            background: rgba(11, 17, 32, 0.9);
            padding: 10px;
            border-radius: 14px;
            border: 2px solid #854d0e;
        }
        .icon-btn {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            border: 2px solid #64748b;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            text-decoration: none;
        }
        .icon-btn:active {
            transform: scale(0.9);
        }

        /* Styles spécifiques en jeu (Ardoise) */
        #gameScreen {
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid #38bdf8;
            border-radius: 14px;
            padding: 12px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        #themeDisplay {
            font-size: 0.8rem;
            color: #38bdf8;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
        }
        #wordDisplay {
            font-size: 1.6rem;
            letter-spacing: 6px;
            margin: 8px 0;
            color: #facc15;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
        }
        #timerDisplay {
            font-size: 0.85rem;
            color: #f87171;
            font-weight: 700;
        }
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: rgba(11, 17, 32, 0.85);
            padding: 6px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #38bdf8;
        }
        .virtual-keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 6px;
        }
        .key-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 10px 0;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .key-btn:disabled {
            background: #1e293b;
            color: #475569;
        }
        .taunts-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-top: 6px;
        }
        .taunt-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 4px 6px;
            font-size: 0.65rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .hidden { display: none !important; }
        .room-box {
            background: #0b1120;
            padding: 10px;
            border-radius: 8px;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.95rem;
            margin: 8px 0;
            text-align: center;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="arcade-container" id="mainContainer">
        <!-- EN-TÊTE -->
        <div class="arcade-header">
            <h1>Slate Battle ✏️</h1>
            <div class="coins-display">🪙 Pièces : <span id="playerCoins">75</span></div>
        </div>

        <!-- CENTRE DE L'ECRAN (Dynamique) -->
        <div class="arcade-screen-center">
            
            <!-- 1. MENU PRINCIPAL (Style Panneaux de Bois) -->
            <div id="menuScreen" class="wood-menu-box">
                <input type="text" id="playerNameInput" placeholder="Ton pseudo (ex: Dédé)..." maxlength="12">
                <button class="btn-wood" id="localBtn">🎮 JOUER EN SOLO</button>
                <button class="btn-wood" id="hostBtn">🌐 CRÉER PARTIE</button>
                <button class="btn-wood" id="joinBtn">🔑 REJOINDRE</button>
            </div>

            <!-- 2. ECRAN HÔTE -->
            <div id="hostScreen" class="wood-menu-box hidden" style="text-align: center;">
                <p style="color: #cbd5e1; font-size: 0.85rem;">Envoie ce code à ton ami :</p>
                <div class="room-box" id="myPeerId">Génération...</div>
                <p style="color: #f59e0b; font-size: 0.8rem;" id="hostStatusText">En attente de l'adversaire...</p>
                <button class="btn-wood btn-green" id="shareCodeWhatsApp">💬 Partager sur WhatsApp</button>
                <button class="btn-wood" id="backFromHost" style="background: #334155; border-color: #64748b; margin-top: 5px;">Retour</button>
            </div>

            <!-- 3. ECRAN REJOINDRE -->
            <div id="joinScreen" class="wood-menu-box hidden" style="text-align: center;">
                <p style="color: #cbd5e1; font-size: 0.85rem;">Entre le code salon :</p>
                <input type="text" id="joinCodeInput" placeholder="Colle le code ici...">
                <button class="btn-wood btn-green" id="connectBtn">Se connecter</button>
                <button class="btn-wood" id="backFromJoin" style="background: #334155; border-color: #64748b; margin-top: 5px;">Retour</button>
            </div>

            <!-- 4. ECRAN DE JEU (Ardoise) -->
            <div id="gameScreen" class="hidden">
                <div class="scoreboard">
                    <div>Moi : <span id="myScore">0</span></div>
                    <div>Manche : <span id="currentRound">1</span>/3</div>
                    <div>Adversaire : <span id="opponentScore">0</span></div>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                    <span id="timerDisplay">⏳ 60s</span>
                    <button class="btn-wood" style="padding: 4px 8px; font-size: 0.75rem; width: auto;" onclick="quitGame()">🚪 Quitter</button>
                </div>
                
                <div style="margin: 10px 0;">
                    <div id="themeDisplay">Thème : Chargement...</div>
                    <div id="wordDisplay">_ _ _ _ _</div>
                    <div id="chatLog" style="font-size: 0.7rem; color: #38bdf8; height: 14px; text-align: center; font-style: italic;"></div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                        <span id="errorsDisplay" style="color: #cbd5e1; font-size: 0.75rem;">Erreurs : 0 / 6</span>
                        <button class="btn-wood" style="padding: 4px 8px; font-size: 0.7rem; width: auto; background: #eab308; color: #000; border-color: #ca8a04;" onclick="buyHint()">💡 Indice (-20)</button>
                    </div>
                </div>

                <div class="virtual-keyboard" id="virtualKeyboard"></div>

                <div class="taunts-container">
                    <button class="taunt-btn" onclick="sendTaunt('🐢 Plus vite !')">🐢 Plus vite</button>
                    <button class="taunt-btn" onclick="sendTaunt('😎 Facile !')">😎 Facile</button>
                    <button class="taunt-btn" onclick="sendTaunt('😱 Raté !')">😱 Raté</button>
                    <button class="taunt-btn" onclick="sendTaunt('🔥 Je chauffe !')">🔥 Je chauffe</button>
                </div>
            </div>

        </div>

        <!-- BARRE D'ICÔNES DU BAS (Style ton image) -->
        <div class="arcade-footer-icons" id="footerIcons">
            <a href="https://wa.me/?text=Viens%20on%20joue%20à%20Slate%20Battle%20sur%20https://dd-dev-88.github.io/slate-battle/" target="_blank" class="icon-btn" title="Inviter sur WhatsApp">💬</a>
            <button class="icon-btn" onclick="alert('Bouton Trophées / Classement bientôt disponible !')" title="Classement">🏆</button>
            <button class="icon-btn" onclick="alert('Slate Battle v2.1 - Développé par Dd !')" title="Infos">⭐</button>
            <button class="icon-btn" onclick="alert('Paramètres audio actifs')" title="Paramètres">⚙️</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'correct') {
                osc.frequency.setValueAtTime(587.33, now); osc.frequency.setValueAtTime(880, now + 0.08);
            } else {
                osc.frequency.setValueAtTime(150, now);
            }
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        }

        const menuScreen = document.getElementById('menuScreen');
        const hostScreen = document.getElementById('hostScreen');
        const joinScreen = document.getElementById('joinScreen');
        const gameScreen = document.getElementById('gameScreen');
        const footerIcons = document.getElementById('footerIcons');

        const localBtn = document.getElementById('localBtn');
        const hostBtn = document.getElementById('hostBtn');
        const joinBtn = document.getElementById('joinBtn');
        const connectBtn = document.getElementById('connectBtn');
        const backFromHost = document.getElementById('backFromHost');
        const backFromJoin = document.getElementById('backFromJoin');
        const shareCodeWhatsApp = document.getElementById('shareCodeWhatsApp');

        const playerNameInput = document.getElementById('playerNameInput');
        const joinCodeInput = document.getElementById('joinCodeInput');
        const myPeerIdEl = document.getElementById('myPeerId');
        const wordDisplay = document.getElementById('wordDisplay');
        const themeDisplay = document.getElementById('themeDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const errorsDisplay = document.getElementById('errorsDisplay');
        const chatLog = document.getElementById('chatLog');
        const virtualKeyboard = document.getElementById('virtualKeyboard');
        const playerCoinsEl = document.getElementById('playerCoins');
        const hostStatusText = document.getElementById('hostStatusText');

        const wordBank = [
            { word: "JAVASCRIPT", theme: "Technologie & Web" },
            { word: "PROGRAMME", theme: "Technologie & Web" },
            { word: "ORDINATEUR", theme: "Technologie & Web" },
            { word: "MAISON", theme: "Vie quotidienne" },
            { word: "LUMIERE", theme: "Vie quotidienne" },
            { word: "OCEAN", theme: "Nature & Environnement" },
            { word: "SOLEIL", theme: "Nature & Environnement" },
            { word: "VICTOIRE", theme: "Compétition" },
            { word: "CHAMPION", theme: "Compétition" }
        ];

        let currentItem = wordBank[0];
        let guessedLetters = [];
        let errors = 0;
        let myScore = 0;
        let opponentScore = 0;
        let round = 1;
        let timeLeft = 60;
        let timer;
        let playerName = "Moi";
        let playerCoins = 75;
        let peer = null, conn = null, generatedRoomId = "";

        function showView(view) {
            menuScreen.classList.add('hidden');
            hostScreen.classList.add('hidden');
            joinScreen.classList.add('hidden');
            gameScreen.classList.add('hidden');
            footerIcons.style.display = 'flex';

            if (view === 'menu') menuScreen.classList.remove('hidden');
            if (view === 'host') hostScreen.classList.remove('hidden');
            if (view === 'join') joinScreen.classList.remove('hidden');
            if (view === 'game') {
                gameScreen.classList.remove('hidden');
                footerIcons.style.display = 'none'; // Cache la barre du bas en jeu pour laisser place au clavier
            }
        }

        function updateDisplay() {
            let displayed = currentItem.word.split('').map(l => guessedLetters.includes(l) ? l : '_').join(' ');
            wordDisplay.innerText = displayed;
            themeDisplay.innerText = `Thème : ${currentItem.theme}`;
            errorsDisplay.innerText = `Erreurs : ${errors} / 6`;
            if (!displayed.includes('_')) {
                clearInterval(timer);
                playSound('correct');
                playerCoins += 25;
                playerCoinsEl.innerText = playerCoins;
                alert("Victoire ! +25 🪙");
                nextRound();
            }
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 60;
            timerDisplay.innerText = `⏳ ${timeLeft}s`;
            timer = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `⏳ ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    alert("Temps écoulé !");
                    nextRound();
                }
            }, 1000);
        }

        function buildKeyboard() {
            virtualKeyboard.innerHTML = '';
            for (let letter of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") {
                const btn = document.createElement('button');
                btn.classList.add('key-btn');
                btn.innerText = letter;
                btn.id = `key-${letter}`;
                btn.addEventListener('click', () => handleGuess(letter));
                virtualKeyboard.appendChild(btn);
            }
        }

        function startGame() {
            if (playerNameInput.value.trim()) playerName = playerNameInput.value.trim();
            showView('game');
            nextRound();
        }

        function nextRound() {
            errors = 0;
            guessedLetters = [];
            currentItem = wordBank[Math.floor(Math.random() * wordBank.length)];
            buildKeyboard();
            startTimer();
            updateDisplay();
        }

        function quitGame() {
            if (confirm("Quitter la partie ?")) {
                clearInterval(timer);
                if (peer) peer.destroy();
                showView('menu');
            }
        }

        localBtn.addEventListener('click', startGame);

        hostBtn.addEventListener('click', () => {
            showView('host');
            if (peer) peer.destroy();
            peer = new Peer();
            peer.on('open', (id) => {
                generatedRoomId = id;
                myPeerIdEl.innerText = id;
            });
            peer.on('connection', (c) => {
                conn = c;
                hostStatusText.innerText = "Adversaire connecté !";
                setTimeout(startGame, 1000);
            });
        });

        shareCodeWhatsApp.addEventListener('click', () => {
            if (!generatedRoomId) return;
            const msg = encodeURIComponent(`Viens m'affronter sur Slate Battle ! Code : ${generatedRoomId} - https://dd-dev-88.github.io/slate-battle/`);
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        });

        joinBtn.addEventListener('click', () => showView('join'));

        connectBtn.addEventListener('click', () => {
            const code = joinCodeInput.value.trim();
            if (!code) { alert("Entre un code !"); return; }
            if (peer) peer.destroy();
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(code);
                startGame();
            });
        });

        backFromHost.addEventListener('click', () => { showView('menu'); if (peer) peer.destroy(); });
        backFromJoin.addEventListener('click', () => { showView('menu'); if (peer) peer.destroy(); });

        window.sendTaunt = function(msg) {
            chatLog.innerText = `💬 ${playerName} : "${msg}"`;
            setTimeout(() => { chatLog.innerText = ""; }, 3000);
            if (conn && conn.open) conn.send({ type: 'TAUNT', sender: playerName, message: msg });
        };

        function handleGuess(letter) {
            if (guessedLetters.includes(letter)) return;
            guessedLetters.push(letter);
            document.getElementById(`key-${letter}`).disabled = true;
            if (currentItem.word.includes(letter)) {
                playSound('correct');
            } else {
                errors++;
                playSound('wrong');
                if (errors >= 6) {
                    clearInterval(timer);
                    alert(`Perdu ! Le mot était : ${currentItem.word}`);
                    nextRound();
                    return;
                }
            }
            updateDisplay();
        }
    </script>
</body>
</html>
