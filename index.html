<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slate Battle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        #wordDisplay {
            font-size: 2rem;
            letter-spacing: 8px;
            margin: 20px 0;
            color: #facc15;
        }
        #timerDisplay {
            font-size: 1.2rem;
            color: #f87171;
            margin-bottom: 15px;
        }
        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Slate Battle</h1>

        <!-- Menu Principal -->
        <div id="menuScreen">
            <p style="margin-bottom: 20px; color: #94a3b8;">Le jeu de devinette de lettres multijoueur</p>
            <button class="btn" id="startBtn">Commencer à jouer</button>
        </div>

        <!-- Écran de jeu -->
        <div id="gameScreen" class="hidden">
            <div class="scoreboard">
                <div>Score : <span id="myScore">0</span></div>
                <div>Manche : <span id="currentRound">1</span>/3</div>
            </div>
            
            <div id="timerDisplay">⏳ 60s</div>
            <div id="wordDisplay">_ _ _ _ _</div>
            <p id="errorsDisplay" style="margin-bottom: 15px; color: #cbd5e1;">Erreurs : 0 / 6</p>

            <div id="inputArea">
                <input type="text" id="letterInput" maxlength="1" placeholder="Tape une lettre...">
                <button class="btn" id="guessBtn">Proposer</button>
            </div>
        </div>
    </div>

    <script>
        // Logique simplifiée intégrée pour s'assurer que tout réagit au clic
        const startBtn = document.getElementById('startBtn');
        const menuScreen = document.getElementById('menuScreen');
        const gameScreen = document.getElementById('gameScreen');
        const guessBtn = document.getElementById('guessBtn');
        const letterInput = document.getElementById('letterInput');
        const wordDisplay = document.getElementById('wordDisplay');
        const myScoreEl = document.getElementById('myScore');
        const currentRoundEl = document.getElementById('currentRound');
        const errorsDisplay = document.getElementById('errorsDisplay');

        let secretWord = "JAVASCRIPT";
        let guessedLetters = [];
        let errors = 0;
        let maxErrors = 6;
        let score = 0;
        let round = 1;
        let timeLeft = 60;
        let timer;

        function updateDisplay() {
            let displayed = secretWord.split('').map(letter => guessedLetters.includes(letter) ? letter : '_').join(' ');
            wordDisplay.innerText = displayed;
            errorsDisplay.innerText = `Erreurs : ${errors} / ${maxErrors}`;
            myScoreEl.innerText = score;
            currentRoundEl.innerText = round;

            if (!displayed.includes('_')) {
                clearInterval(timer);
                alert("Bravo ! Tu as trouvé le mot !");
                score++;
                nextRound();
            }
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = 60;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = `⏳ ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    alert("Temps écoulé !");
                    nextRound();
                }
            }, 1000);
        }

        function nextRound() {
            round++;
            if (round > 3) {
                alert(`Partie terminée ! Score final : ${score}`);
                round = 1;
                score = 0;
            }
            errors = 0;
            guessedLetters = [];
            startTimer();
            updateDisplay();
        }

        startBtn.addEventListener('click', () => {
            menuScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            startTimer();
            updateDisplay();
        });

        guessBtn.addEventListener('click', () => {
            const letter = letterInput.value.toUpperCase();
            letterInput.value = '';
            if (!letter || guessedLetters.includes(letter)) return;

            guessedLetters.push(letter);

            if (!secretWord.includes(letter)) {
                errors++;
                if (errors >= maxErrors) {
                    clearInterval(timer);
                    alert(`Perdu ! Le mot était : ${secretWord}`);
                    nextRound();
                    return;
                }
            }
            updateDisplay();
        });
    </script>
</body>
</html>
